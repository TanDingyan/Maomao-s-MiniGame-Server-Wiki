<!DOCTYPE html>
<html lang="zh" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-en="Changelog - Maomao's MiniGame Server" data-zh="更新日志 - 毛毛的小游戏服务器">更新日志 - 毛毛的小游戏服务器</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('maomao-theme');
        if (!t) t = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <nav id="navbar"></nav>

  <main class="container">

    <section class="section">
      <h2 class="section-title" data-en="Changelog" data-zh="更新日志">更新日志</h2>
      <p class="lead" data-en="Development progress and version history of the server."
         data-zh="服务器的开发进度与版本历史。">服务器的开发进度与版本历史。</p>
    </section>

    <section class="section">
      <!-- 时间线样式，新版本放在最上方 -->
      <div class="changelog-item">
        <div>
          <span class="ver" data-en="Server Launch" data-zh="服务器成立">服务器成立</span>
          <span class="date">2026-10-13</span>
        </div>
        <ul>
          <li data-en="Server went online: Paper core, address play.simpfun.cn:34789." data-zh="服务器正式上线：Paper 核心，地址 play.simpfun.cn:34789。">服务器正式上线：Paper 核心，地址 play.simpfun.cn:34789。</li>
          <li data-en="Supported versions 1.8 - 26.2, recommended 26.2." data-zh="支持版本 1.8 - 26.2，推荐 26.2。">支持版本 1.8 - 26.2，推荐 26.2。</li>
          <li data-en="Original minigame design started; catalog under active development." data-zh="原创小游戏设计启动，游戏目录持续开发中。">原创小游戏设计启动，游戏目录持续开发中。</li>
        </ul>
      </div>
    </section>

  </main>

  <footer>
    <div class="container">
      <span data-en="Maomao's MiniGame Server Wiki · Powered by static HTML" data-zh="毛毛的小游戏服务器 Wiki · 静态 HTML 驱动">毛毛的小游戏服务器 Wiki · 静态 HTML 驱动</span>
    </div>
  </footer>

  <script src="./js/main.js"></script>
</body>
</html>
